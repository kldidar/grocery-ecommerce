name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-django-secret-key-12345678901234567890
  DJANGO_DEBUG: "False"
  ALLOWED_HOSTS: example.com

  POSTGRES_DB: ci
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

  REDIS_URL: redis://localhost:6379/0

  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: ci-password-12345
  MINIO_BUCKET_NAME: ci-media
  MINIO_ENDPOINT_URL: http://localhost:9000

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: ci-password-12345
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked --all-extras --dev

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              exit 0
            fi

            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done

          echo "MinIO failed to become ready"
          docker ps -a
          docker logs "$(docker ps -aq --filter 'ancestor=quay.io/minio/minio:latest')" || true
          exit 1

      - name: Create and verify the MinIO bucket
        run: |
          uv run python - <<'PY'
          import os

          import boto3

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["MINIO_ENDPOINT_URL"],
              aws_access_key_id=os.environ["MINIO_ROOT_USER"],
              aws_secret_access_key=os.environ["MINIO_ROOT_PASSWORD"],
          )

          bucket = os.environ["MINIO_BUCKET_NAME"]

          try:
              s3.create_bucket(Bucket=bucket)
          except s3.exceptions.BucketAlreadyOwnedByYou:
              pass

          s3.head_bucket(Bucket=bucket)
          print(f"MinIO bucket is ready: {bucket}")
          PY

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Show type-checking tool versions
        run: |
          uv run python --version
          uv run mypy --version
          uv run python -c "import django; print('Django:', django.get_version())"
          uv run python -c "from importlib.metadata import version; print('django-stubs:', version('django-stubs'))"
          uv run python -c "from importlib.metadata import version; print('django-stubs-ext:', version('django-stubs-ext'))"
          uv run python -c "from importlib.metadata import version; print('djangorestframework-stubs:', version('djangorestframework-stubs'))"

      - name: Run mypy
        run: uv run mypy .

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r .

      - name: Run tests with coverage
        run: uv run coverage run -m pytest

      - name: Generate coverage report
        run: uv run coverage report

      - name: Django deployment security check
        run: >
          uv run python manage.py check --deploy
          --settings=config.settings.production
