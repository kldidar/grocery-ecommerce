name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    # Placeholder values sufficient for static analysis only. mypy's
    # django-stubs plugin imports the settings module to introspect models,
    # which requires these variables to be present and well-formed — see
    # the architecture note above. None of these are real credentials.
    env:
      DJANGO_SECRET_KEY: ci-placeholder-secret-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run Ruff (lint)
        run: uv run ruff check .

      - name: Run Ruff (format check)
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r .
