name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-placeholder-secret-key
  DJANGO_DEBUG: "False"

  POSTGRES_DB: ci
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

  REDIS_URL: redis://localhost:6379/0

  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: ci-minio-password
  MINIO_BUCKET_NAME: media
  MINIO_ENDPOINT_URL: http://localhost:9000

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: ci-minio-password
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        command: server /data --console-address ":9001"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Create MinIO bucket
        run: |
          docker run --rm \
            --network host \
            --entrypoint /bin/sh \
            quay.io/minio/mc:latest \
            -c '
              mc alias set local http://127.0.0.1:9000 minioadmin ci-minio-password &&
              mc mb --ignore-existing local/media
            '

      - name: Run Ruff (lint)
        run: uv run ruff check .

      - name: Run Ruff (format check)
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r .

      - name: Run tests with coverage
        run: uv run coverage run -m pytest

      - name: Generate coverage report
        run: uv run coverage report

      - name: Django deployment security check
        run: >
          uv run python manage.py check --deploy
          --settings=config.settings.production
        env:
          DJANGO_ALLOWED_HOSTS: example.com
