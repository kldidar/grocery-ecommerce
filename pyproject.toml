[project]
name = "food-ecommerce-backend"
version = "0.1.0"
description = "Production-ready backend for a food e-commerce platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django~=6.1",
    "psycopg[binary]~=3.2",
    "pydantic-settings~=2.9",
]

[dependency-groups]
dev = [
    "ruff~=0.16",
    "mypy",
    "django-stubs[compatible-mypy]",
    "bandit[toml]",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort — import sorting (see ADR-003)
    "UP",   # pyupgrade — modern syntax for the target Python version
    "B",    # flake8-bugbear — common bug-prone patterns
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django — Django-specific rules
    "S",    # flake8-bandit — fast subset; standalone Bandit (below) remains
            # the authoritative security check
    "ANN",  # flake8-annotations — enforces type hints (Constitution Rule 11)
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]  # autogenerated code, not hand-edited

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = [
    "^\\.venv/",
    "^docker/",
]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
