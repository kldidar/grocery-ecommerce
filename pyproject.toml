[project]
name = "food-ecommerce-backend"
version = "0.1.0"
description = "Production-ready backend for a food e-commerce platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]~=5.6",
    "django~=6.1",
    "django-filter>=26.1",
    "django-storages[s3]>=1.14.6",
    "django-stubs-ext>=6.1.0",
    "djangorestframework~=3.17",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular~=0.30",
    "drf-spectacular-sidecar>=2026.8.1",
    "psycopg[binary]~=3.2",
    "pydantic-settings~=2.9",
]

[dependency-groups]
dev = [
    "ruff~=0.16",
    "mypy",
    "django-stubs[compatible-mypy]",
    "bandit[toml]",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "coverage[toml]>=7.16.0",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1",
    "celery-types~=0.26",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort — import sorting (see ADR-003)
    "UP",   # pyupgrade — modern syntax for the target Python version
    "B",    # flake8-bugbear — common bug-prone patterns
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django — Django-specific rules
    "S",    # flake8-bandit — fast subset; standalone Bandit (below) remains
            # the authoritative security check
    "ANN",  # flake8-annotations — enforces type hints (Constitution Rule 11)
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]
"**/tests/*.py" = ["S101", "S105", "S106"]
"apps/users/models.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
exclude = [
    "^\\.venv/",
    "^docker/",
]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
# Reuses the test database between runs instead of recreating it every
# time, which is significantly faster once the suite grows. After changing
# a migration, run once with `--create-db` to force a fresh test database.
addopts = "--reuse-db"

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
